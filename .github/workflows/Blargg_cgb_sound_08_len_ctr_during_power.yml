name: Blargg_cgb_sound_08_len_ctr_during_power
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Cache gb-test-roms
        uses: actions/cache@v4
        with:
          path: gb-test-roms
          key: gb-test-roms-v1
      - name: Clone test ROMs (shallow)
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/retrio/gb-test-roms.git
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo run -p blargg_tests -- "gb-test-roms/cgb_sound/rom_singles/08-len ctr during power.gb"
